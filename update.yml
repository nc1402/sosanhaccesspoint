name: Cập nhật danh sách AP
on:
  schedule:
    - cron: "0 1 * * *"   # 08:00 giờ Việt Nam mỗi ngày
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python scripts/update.py
      - name: Commit nếu có thay đổi
        run: |
          git config user.name "aps-bot"
          git config user.email "aps-bot@users.noreply.github.com"
          git add aps.json
          git diff --cached --quiet || (git commit -m "Cập nhật AP $(date +%F)" && git push)
